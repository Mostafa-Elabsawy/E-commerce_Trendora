<section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <header class="flex justify-between mb-4">
        <div>
            <p class="text-black font-bold text-xl"> Filter Products</p>
        </div>

        <div class="flex justify-end items-center gap-2 pt-2 border-t border-slate-100 mt-2 xl:mt-0 xl:pt-0 xl:border-0">
            <button type="button" (click)="applyFilters()" class="btn-primary flex-1 sm:flex-none flex items-center justify-center gap-2 px-6">
                <i class="fa-solid fa-filter"></i>
                Apply Filters
            </button>

            <button type="button" (click)="clearFilters()" class="btn-secondary flex items-center justify-center gap-2" title="Clear Filters">
                <i class="fa-solid fa-rotate-left"></i>
                <span class="xl:hidden">Reset</span>
            </button>
        </div>
    </header>

    <form class="grid gap-4 sm:grid-cols-2  lg:grid-cols-4  items-end" [formGroup]="filterForm">



        <div>
            <label class="filter-label">
                Brand
            </label>
            <select [formControl]="filterForm.controls.brandId" class="filter-control">
                <option [ngValue]="null">All Brands</option>
                @for (brand of brands(); track brand.id) {
                <option [ngValue]="brand.id">{{ brand.name }}</option>
                }
            </select>
        </div>

        <div>
            <label class="filter-label">
                Category
            </label>
            <select [formControl]="filterForm.controls.categoryId" (change)="filterForm.controls.subCategoryId.setValue(null)" class="filter-control">
                <option [ngValue]="null">All Categories</option>
                @for (cat of categories(); track cat.id) {
                <option [ngValue]="cat.id">{{ cat.name }}</option>
                }
            </select>
        </div>

        <div>
            <label class="filter-label">
                Subcategory
            </label>
            <select [formControl]="filterForm.controls.subCategoryId" class="filter-control">
                <option [ngValue]="null">All Subcategories</option>
                @for (sub of filteredSubCategories(); track sub.id) {
                <option [ngValue]="sub.id">{{ sub.name }}</option>
                }
            </select>
        </div>

        <div>
            <label class="filter-label">
                Sort By
            </label>
            <select [formControl]="filterForm.controls.sort" class="filter-control">
                <option [ngValue]="null">Sorted By</option>
                @for (item of ["NameAsc" ,"NameDesc" ,"PriceAsc ", "PriceDesc" ]; track $index) {
                <option [ngValue]="item">{{item}}</option>
                }
            </select>
        </div>
        <div class="sm:col-span-full">
            <label class="filter-label">
                Search
            </label>
            <input type="text" [formControl]="filterForm.controls.search" placeholder="Search products..." class="filter-control" />
        </div>

    </form>


</section>
