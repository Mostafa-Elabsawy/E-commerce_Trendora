<div class="min-h-screen">
    <!-- Header -->
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 sm:text-3xl">Edit Product</h1>
            <p class="mt-1 text-sm text-slate-500">
                Update product information and inventory.
            </p>
        </div>

        <div class="flex gap-3">
            <button type="button" (click)="cancel()" class="rounded-xl border border-slate-200 bg-white px-5 py-3 font-medium text-slate-700 hover:bg-slate-100">
                Cancel
            </button>

            <button type="button" (click)="save()" [disabled]="editForm.invalid || saving()" class="rounded-xl bg-black px-5 py-3 font-medium text-white hover:bg-black/80 disabled:opacity-50">
                @if (!saving()) {
                Save Changes
                } @else {
                Saving...
                }
            </button>
        </div>
    </div>

    <form [formGroup]="editForm">
        <div class="grid grid-cols-1 gap-8 md:grid-cols-2">
            <!-- Image -->
            <div class="col-span-2 md:col-span-1">
                <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                    <h2 class="text-lg font-bold text-slate-900">Product Image</h2>

                    <div class="mt-5 aspect-square overflow-hidden rounded-2xl border border-slate-200 bg-slate-100">
                        <img [src]="imagePreview()" class="h-full w-full object-cover">
                    </div>

                    <div class="mt-6">
                        <label class="mb-2 block text-sm font-medium text-slate-700">
                            Image URL
                        </label>
                        <input type="text" formControlName="pictureUrl" class="input-base-2">
                    </div>
                </div>
            </div>

            <!-- Basic -->
            <div class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm md:col-span-1">
                <h2 class="mb-6 text-lg font-bold text-slate-900">
                    Basic Information
                </h2>

                <div class="space-y-5">
                    <div>
                        <label class="mb-2 block text-sm font-medium text-slate-700">
                            Product Name
                        </label>
                        <input type="text" formControlName="name" class="input-base-2">
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Stock
                        </label>
                        <input type="number" formControlName="stockQuantity" class="input-base-2">
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-medium text-slate-700">
                            Description
                        </label>
                        <textarea rows="6" formControlName="description" class="w-full resize-none rounded-xl border border-slate-300 px-4 py-3"></textarea>
                    </div>
                </div>
            </div>

            <!-- Category -->
            <div class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="mb-6 text-lg font-bold text-slate-900">
                    Category Information
                </h2>

                <div class="grid gap-5 md:grid-cols-3">
                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Category
                        </label>
                        <select formControlName="categoryName" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition-all duration-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
                            @for (item of ["Sports & Outdoors", "Electronics", "Home & Kitchen"]; track $index) {
                            <option [value]="item">{{ item }}</option>
                            }
                        </select>
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Brand
                        </label>
                        <input formControlName="productBrand" class="input-base-2">
                    </div>



                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Sub Category
                        </label>
                        <input formControlName="subCategory" class="input-base-2">
                    </div>
                </div>
            </div>

            <!-- Pricing -->
            <div class="col-span-2 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                <h2 class="mb-6 text-lg font-bold text-slate-900">
                    Pricing & Inventory
                </h2>

                <div class="grid gap-5 lg:grid-cols-4">
                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Price
                        </label>
                        <input type="number" formControlName="price" class="input-base-2">
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Discount %
                        </label>
                        <input type="number" formControlName="discount" class="input-base-2">
                    </div>

                    <div>
                        <label class="mb-2 block text-sm font-medium">
                            Final Price
                        </label>

                        <div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 font-bold text-emerald-700">
                            {{ finalPrice | currency:'EGP':'symbol':'1.0-0' }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
